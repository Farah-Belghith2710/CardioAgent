# CardioAgent-Ops: the micro-services on the Docker network "cardio-net"
#
# 2 modes for the LLM of the agents and of the chat (settings LLM_* in the file .env, see .env.example):
#   online mode (default): an online LLM with an API key (Groq or xAI): 5 containers + the API of the provider
#       scripts/start_online_mode.ps1        (= docker compose up -d --build)
#   local mode (the version of the PDF, nothing leaves the PC): the 6 containers, with llm-server (Ollama)
#       scripts/start_local_mode.ps1         (= LLM_PROVIDER=ollama + docker compose --profile local-llm up -d --build)
#
#   docker compose run --rm agent-orchestrator python -m rag_engine.ingest      index the RAG documents (once)
#   docker compose ps                               see the state (and the healthchecks) of the services
#
# client --(.wav)--> api-gateway:8000 --> audio-engine:8001 (5 ONNX models, logs in MLflow)
#                         '--> agent-orchestrator:8002 --> vector-db:6333 (RAG) + the LLM (Groq / xAI, or llm-server) + MLflow
name: cardioagent

services:
  # ---------- Service 1: the LLM (Ollama), local and quantized (GGUF 4-bit) ----------
  # only in the local mode (profile "local-llm"): docker compose --profile local-llm up -d
  llm-server:
    profiles: ["local-llm"]
    restart: "no"                                      # never by itself: only scripts/start_local_mode.ps1 starts it
                                                       # (in the online mode its 2 GB model would slow the whole PC)
    build:
      context: .
      dockerfile: docker/llm-server.Dockerfile
    environment:
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b-instruct}    # cardio-llm once the fine-tuned GGUF is in llm_server/models/
      OLLAMA_KEEP_ALIVE: "-1"                          # the model stays in memory (no reload before each report)
      OLLAMA_LOAD_TIMEOUT: "30m"                       # reading the model from the Docker disk can be slow
    volumes:
      - ollama-data:/root/.ollama                      # the downloaded / created models (kept between restarts)
      - ./llm_server/models:/models:ro                 # the fine-tuned GGUF (git-ignored, ~4.7 GB)
    ports:
      - "11435:11434"                                  # 11434 on the PC is already used by a native Ollama
    healthcheck:                                       # healthy = the model of the agents is loaded in memory
      test: ["CMD-SHELL", "ollama ps | grep -q \"$$LLM_MODEL\""]
      interval: 15s
      timeout: 10s
      retries: 240                                     # the first download of the model can take a while
      start_period: 30s
    networks: [cardio-net]

  # ---------- Service 2: the vector database of the RAG (Qdrant) ----------
  vector-db:
    build:
      context: .
      dockerfile: docker/vector-db.Dockerfile
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [cardio-net]
    restart: unless-stopped

  # ---------- Service 3: the audio engine (5 models in ONNX, benchmark, inference logs) ----------
  audio-engine:
    build:
      context: .
      dockerfile: docker/audio-engine.Dockerfile
    init: true                                         # a tiny init: stops cleanly, no zombie process
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
    ports:
      - "8001:8001"
    depends_on:
      mlflow-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 30                                      # a busy PC: wait up to 5 more minutes before "unhealthy"
      start_period: 300s                               # the warm-up of the 5 models at start (main.py)
    networks: [cardio-net]
    restart: unless-stopped

  # ---------- Service 4: the 3 agents (LangGraph) + the RAG + the Pydantic guardrails ----------
  agent-orchestrator:
    build:
      context: .
      dockerfile: docker/agent-orchestrator.Dockerfile
    init: true                                         # a tiny init: stops cleanly, no zombie process
    environment:
      QDRANT_URL: http://vector-db:6333
      # the LLM (agents/llm.py), from the file .env; a value set in the terminal wins over .env
      # (scripts/start_local_mode.ps1 sets LLM_PROVIDER=ollama). Only this container receives the key.
      LLM_PROVIDER: ${LLM_PROVIDER:-}                  # groq / xai / ollama, empty = guessed from the key
      LLM_API_KEY: ${LLM_API_KEY:-}                    # secret: never in an image, never in git
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}                        # empty = the default model of the provider
      LLM_URL: http://llm-server:11434                 # the local LLM (local mode)
      LLM_TIMEOUT: "600"
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      RAG_DOCS_FOLDER: /docs
      RAG_WARMUP: "1"                                  # load the embedding model of the RAG at start (agents/main.py)
    volumes:
      - ./article for rag:/docs:ro                    # the RAG documents (read only), for rag_engine.ingest
    ports:
      - "8002:8002"
    depends_on:
      vector-db:
        condition: service_healthy
      llm-server:
        condition: service_healthy
        required: false                                # only in the local mode: the online mode does not need it
      mlflow-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s                               # loading LangGraph + the embedding model takes time on our PC
    networks: [cardio-net]
    restart: unless-stopped

  # ---------- Service 5: the API gateway (the only entry point: /analyze_pcg and the web page) ----------
  api-gateway:
    build:
      context: .
      dockerfile: docker/api-gateway.Dockerfile
    init: true                                         # a tiny init: stops cleanly, no zombie process
    environment:
      AUDIO_ENGINE_URL: http://audio-engine:8001/predict
      ORCHESTRATOR_URL: http://agent-orchestrator:8002/orchestrate
      ORCHESTRATOR_TIMEOUT: "900"
    ports:
      - "8000:8000"
    depends_on:
      audio-engine:
        condition: service_healthy
      agent-orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [cardio-net]
    restart: unless-stopped

  # ---------- Service 6: MLflow (tracking of the experiments, Model Registry, inference logs) ----------
  mlflow-server:
    build:
      context: .
      dockerfile: docker/mlflow-server.Dockerfile
    volumes:
      - mlflow-data:/mlflow                            # all the runs since the beginning of the project
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s                               # the first start checks the database (~4 min on our PC)
    networks: [cardio-net]
    restart: unless-stopped

networks:
  cardio-net:

volumes:
  mlflow-data:
    external: true          # the volume that already holds all the MLflow runs (docker volume create mlflow-data)
  qdrant-data:
    name: qdrant-data
  ollama-data:
    name: ollama-data
