<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analyse PCG</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
      background: #eef2f8;
      color: #1f2937;
    }
    .card {
      max-width: 560px;
      margin: 60px auto;
      padding: 32px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 6px; font-size: 26px; }
    .subtitle { margin: 0 0 28px; color: #6b7280; }
    .upload {
      padding: 24px;
      border: 2px dashed #c3cde0;
      border-radius: 10px;
      background: #f8fafd;
      text-align: center;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #result { margin-top: 24px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #e5e7eb; text-align: left; vertical-align: top; }
    th { width: 40%; color: #6b7280; font-weight: 600; }
    .loading { color: #2563eb; }
    .error { padding: 12px; border-radius: 8px; background: #fef2f2; color: #b91c1c; }
    .footer { margin-top: 28px; font-size: 14px; color: #6b7280; text-align: center; }
    .footer a { color: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Analyse PCG</h1>
    <p class="subtitle">Envoyez un enregistrement cardiaque (.wav) pour l'analyser.</p>

    <div class="upload">
      <input type="file" id="file" accept=".wav">
    </div>
    <button onclick="analyze()">Analyser</button>

    <div id="result"></div>

    <p class="footer">
      Service 5 : api-gateway &middot; <a href="/docs">Documentation de l'API (/docs)</a> &middot; <a href="/health">/health</a>
    </p>
  </div>

  <script>
    // nicer names for the fields the gateway sends back
    const LABELS = {
      filename: "Fichier",
      size_bytes: "Taille (octets)",
      duration_s: "Durée (secondes)",
      message: "Message",
      prediction: "Prédiction"
    };

    function showError(text) {
      const result = document.getElementById("result");
      result.innerHTML = "";
      const p = document.createElement("p");
      p.className = "error";
      p.textContent = text;
      result.appendChild(p);
    }

    async function analyze() {
      const file = document.getElementById("file").files[0];
      const result = document.getElementById("result");

      if (!file) {
        showError("Choisissez d'abord un fichier .wav");
        return;
      }
      result.innerHTML = '<p class="loading">Analyse en cours...</p>';

      // send the file to /analyze_pcg, like "Try it out" in /docs does
      const form = new FormData();
      form.append("file", file);    // "file" = the same name as in main.py

      try {
        const response = await fetch("/analyze_pcg", { method: "POST", body: form });
        const data = await response.json();

        // error from the gateway (400: not a .wav, 503: a service is down)
        if (!response.ok) {
          const detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
          showError("Erreur " + response.status + " : " + detail);
          return;
        }

        // success: one table row per field of the answer
        const table = document.createElement("table");
        for (const key in data) {
          const name = document.createElement("th");
          name.textContent = LABELS[key] || key;
          const value = document.createElement("td");
          value.textContent = typeof data[key] === "object" ? JSON.stringify(data[key]) : data[key];
          table.insertRow().append(name, value);
        }
        result.innerHTML = "";
        result.appendChild(table);
      } catch (error) {
        showError("Le serveur ne répond pas : " + error);
      }
    }
  </script>
</body>
</html>
