# CI/CD of CardioAgent-Ops (GitHub Actions): at each push and pull request
#   1. job "tests": the pytest suite (audio engine, API gateway, agents, RAG) + the coverage (must be >= 70 %)
#   2. job "build": only if the tests pass -> build the Docker images of the API gateway and of the audio engine,
#      start them and check their /health endpoint (no push to a registry)
name: mlops-ci-cd

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install the test libraries (no TensorFlow)
        run: pip install -r requirements-test.txt

      - name: Run the tests with the coverage
        run: >
          pytest --cov=audio_engine --cov=api --cov=agents --cov=rag_engine
          --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the image of the API gateway (Service 5)
        run: docker build -f docker/api-gateway.Dockerfile -t cardioagent/api-gateway:ci .

      - name: Build the image of the audio engine (Service 3)
        run: docker build -f docker/audio-engine.Dockerfile -t cardioagent/audio-engine:ci .

      - name: Start the 2 containers and check /health
        run: |
          docker run -d --name api-gateway -p 8000:8000 cardioagent/api-gateway:ci
          docker run -d --name audio-engine -p 8001:8001 cardioagent/audio-engine:ci
          for i in $(seq 1 90); do       # up to 3 min: the audio engine warms up its models at start
            if curl -sf http://localhost:8000/health && curl -sf http://localhost:8001/health; then
              echo; echo "both services are healthy"; exit 0
            fi
            sleep 2
          done
          docker logs api-gateway; docker logs audio-engine
          exit 1
