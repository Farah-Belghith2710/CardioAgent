<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Analyse PCG · CardioAgent-Ops</title>
  <style>
    /* ---------- colors: black theme + ONE main color (blue) ----------
       green and red are only used to give information: green = OK / normal, red = error / abnormal */
    :root {
      --blue: #0A4DFF;          /* the main color (the "Blue" of the color wheel) */
      --blue-hover: #2F66FF;
      --blue-light: #6F9BFF;    /* lighter blue, easier to read on black */
      --green: #5DB52C;
      --red: #FF2D1F;

      --bg: #000000;            /* the page: black */
      --card: #0C0C0F;          /* the main card */
      --surface: #141419;       /* the boxes inside the card */
      --border: #24242C;
      --text: #F5F5F7;
      --muted: #9C9CA8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      color: var(--text);
      background-color: var(--bg);
      /* a very soft blue light above the card, the rest of the page stays black */
      background-image: radial-gradient(700px 360px at 50% -120px, rgba(10, 77, 255, 0.20), transparent 70%);
      background-repeat: no-repeat;
    }

    /* ---------- the card ---------- */
    .card {
      position: relative;
      max-width: 1180px;          /* a computer page (on a phone: see the end of the style) */
      margin: 40px auto;
      padding: 40px 44px 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    }
    .card::before {               /* a thin blue light at the top of the card */
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--blue), transparent);
    }

    /* ---------- header: logo + title + API status ---------- */
    header { display: flex; align-items: center; gap: 16px; }
    .logo {
      flex: none;
      width: 50px; height: 50px;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--blue-hover), var(--blue) 60%, #0838C0);
      box-shadow: 0 8px 24px rgba(10, 77, 255, 0.35);
      display: grid; place-items: center;
    }
    .logo svg { width: 26px; height: 26px; }
    h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.2px; }
    .subtitle { margin: 3px 0 0; font-size: 14px; color: var(--muted); }

    .status {
      margin-left: auto;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12.5px; color: var(--muted);
      white-space: nowrap;
    }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .status.online .dot { background: var(--green); box-shadow: 0 0 0 4px rgba(93, 181, 44, 0.18); }
    .status.offline .dot { background: var(--red); box-shadow: 0 0 0 4px rgba(255, 45, 31, 0.18); }

    /* ---------- 2 columns: left = the .wav, right = the result ---------- */
    .layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 32px;
      align-items: start;
      margin-top: 30px;
    }

    /* ---------- the box to choose / drop the .wav ---------- */
    .drop {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 64px 20px;
      border: 1.5px dashed #34343F;
      border-radius: 14px;
      background: var(--surface);
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop:hover, .drop.over { border-color: var(--blue); background: rgba(10, 77, 255, 0.06); }
    .drop.has-file { border-style: solid; border-color: var(--blue); }
    .drop.bad-file { border-style: solid; border-color: var(--red); }
    .drop:focus-within { outline: 2px solid var(--blue-light); outline-offset: 3px; }
    .drop svg { width: 36px; height: 36px; margin-bottom: 6px; }
    .drop-title { font-weight: 600; word-break: break-all; }
    .drop-hint { font-size: 13.5px; color: var(--muted); }
    .drop input {                 /* the real file input: invisible, the whole box opens it */
      position: absolute;
      width: 1px; height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* ---------- the button ---------- */
    .btn {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      border: none;
      border-radius: 12px;
      background: var(--blue);
      box-shadow: 0 8px 24px rgba(10, 77, 255, 0.28);
      color: #FFFFFF;
      font: inherit; font-size: 16px; font-weight: 600; letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: var(--blue-hover); }
    .btn:active { transform: scale(0.99); }
    .btn:focus-visible { outline: 2px solid var(--blue-light); outline-offset: 3px; }
    .btn:disabled { cursor: wait; opacity: 0.75; }
    .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .btn.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- the result ---------- */
    #result { min-width: 0; }         /* min-width: 0 = the table can scroll instead of making the page wider */
    #result:empty::before {           /* before the first analysis: a message in the empty right column */
      content: "Le résultat de l'analyse s'affichera ici : la réponse du modèle officiel, puis le benchmark des modèles.";
      display: flex; align-items: center; justify-content: center;
      min-height: 360px;
      padding: 24px;
      border: 1.5px dashed #34343F;
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }
    .panel {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      overflow: hidden;
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    .panel-title { font-weight: 600; }
    dl { margin: 0; }
    .row {
      display: grid;
      grid-template-columns: 38% 1fr;
      gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
    }
    .row:last-child { border-bottom: none; }
    .row dt { color: var(--muted); font-size: 14px; }
    .row dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-word; }

    .badge {
      display: inline-flex; align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12.5px; font-weight: 600;
    }
    .badge.blue { color: var(--blue-light); background: rgba(10, 77, 255, 0.14); border: 1px solid rgba(10, 77, 255, 0.45); }
    .badge.green { color: #8FDB62; background: rgba(93, 181, 44, 0.14); border: 1px solid rgba(93, 181, 44, 0.4); }
    .badge.red { color: #FF7A6E; background: rgba(255, 45, 31, 0.12); border: 1px solid rgba(255, 45, 31, 0.4); }

    .error {
      padding: 14px 18px;
      border: 1px solid rgba(255, 45, 31, 0.35);
      border-left: 4px solid var(--red);
      border-radius: 12px;
      background: rgba(255, 45, 31, 0.08);
      color: #FFB3AB;
      line-height: 1.5;
    }
    .error strong { display: block; color: #FF7A6E; }

    /* ---------- the benchmark table (1 line per model) ---------- */
    .bench-panel { margin-top: 14px; }
    .table-wrap { overflow-x: auto; }
    table.bench { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
    .bench th, .bench td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .bench th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
    .bench tr.best td { background: rgba(10, 77, 255, 0.08); }    /* the best model = the official answer */
    .bench-note { padding: 10px 18px 14px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }

    /* ---------- footer ---------- */
    footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 10px;    /* the links on the right */
      font-size: 13px; color: var(--muted);
    }
    footer nav { display: flex; gap: 18px; }
    footer a { color: var(--text); opacity: 0.8; text-decoration: none; }
    footer a:hover { opacity: 1; color: var(--blue-light); }

    /* ---------- small screens (tablet, phone): back to 1 column ---------- */
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; gap: 0; }
      .drop { padding: 30px 20px; }
      #result { margin-top: 22px; }
      #result:empty { margin-top: 0; }
      #result:empty::before { display: none; }
    }
    @media (max-width: 640px) {
      .card { margin: 16px; padding: 28px 20px 22px; }
      header { flex-wrap: wrap; }
      .status { margin-left: 0; }
      .row { grid-template-columns: 1fr; gap: 2px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
          <path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>
        </svg>
      </div>
      <div>
        <h1>CardioAgent-Ops</h1>
        <p class="subtitle">Analyse cardio-acoustique (PCG)</p>
      </div>
      <span id="status" class="status"><span class="dot"></span><span id="status-text">Connexion…</span></span>
    </header>

    <div class="layout">
    <!-- left column: the .wav -->
    <section>
    <label id="drop" class="drop" for="file">
      <svg viewBox="0 0 24 24" fill="none" stroke="#6F9BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2"/>
      </svg>
      <span id="drop-title" class="drop-title">Glissez votre fichier .wav ici</span>
      <span id="drop-hint" class="drop-hint">ou cliquez pour le choisir</span>
      <input type="file" id="file" accept=".wav,audio/wav">
    </label>

    <button id="analyze-btn" class="btn" onclick="analyze()">
      <span class="spinner"></span><span id="btn-text">Analyser</span>
    </button>
    </section>

    <!-- right column: the result -->
    <section id="result" aria-live="polite"></section>
    </div>

    <footer>
      <nav>
        <a href="/docs">Documentation API</a>
        <a href="/health">État du service</a>
      </nav>
    </footer>
  </main>

  <script>
    // nicer names for the fields the gateway sends back
    const LABELS = {
      filename: "Fichier",
      size_bytes: "Taille",
      duration_s: "Durée",
      message: "Message",
      prediction: "Prédiction",
      probability_abnormal: "Probabilité « anormal »",
      model: "Modèle (meilleur recall)",
      features: "Entrée du modèle",
      model_scores: "Scores du modèle (3 folds)",
      warning: "Attention"
    };

    // nicer names for the models of the benchmark
    const MODEL_NAMES = { DecisionTree: "Decision Tree", SVM: "SVM", CNN: "CNN" };

    const fileInput = document.getElementById("file");
    const drop = document.getElementById("drop");
    const result = document.getElementById("result");
    const button = document.getElementById("analyze-btn");

    // ---------- 1. is the API running? (green or red dot at the top) ----------
    fetch("/health")
      .then(response => setStatus(response.ok))
      .catch(() => setStatus(false));

    function setStatus(online) {
      document.getElementById("status").className = "status " + (online ? "online" : "offline");
      document.getElementById("status-text").textContent = online ? "API en ligne" : "API hors ligne";
    }

    // ---------- 2. choose the file: click on the box, or drag & drop it ----------
    fileInput.addEventListener("change", showChosenFile);

    drop.addEventListener("dragover", event => {
      event.preventDefault();
      drop.classList.add("over");
    });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", event => {
      event.preventDefault();
      drop.classList.remove("over");
      fileInput.files = event.dataTransfer.files;    // put the dropped file in the file input
      showChosenFile();
    });

    function showChosenFile() {
      const file = fileInput.files[0];
      if (!file) return;
      const isWav = file.name.toLowerCase().endsWith(".wav");
      drop.classList.toggle("has-file", isWav);     // blue border: a .wav
      drop.classList.toggle("bad-file", !isWav);    // red border: not a .wav
      document.getElementById("drop-title").textContent = file.name;
      document.getElementById("drop-hint").textContent =
        (isWav ? formatSize(file.size) : "Ce n'est pas un .wav") + " · cliquez pour changer";
      result.innerHTML = "";
    }

    // ---------- 3. send the file to /analyze_pcg (like "Try it out" in /docs) ----------
    async function analyze() {
      const file = fileInput.files[0];
      if (!file) {
        showError("Aucun fichier", "Choisissez d'abord un fichier .wav.");
        return;
      }
      setLoading(true);
      result.innerHTML = "";

      const form = new FormData();
      form.append("file", file);    // "file" = the same name as in main.py

      try {
        const response = await fetch("/analyze_pcg", { method: "POST", body: form });
        const data = await response.json();

        if (response.ok) {
          showResult(data);
        } else {
          // error from the gateway (400: not a .wav, 503: a service is down)
          const detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
          showError("Erreur " + response.status, detail);
        }
      } catch (error) {
        showError("Le serveur ne répond pas", String(error));
      }
      setLoading(false);
    }

    // ---------- 4. show the answer: one line per field ----------
    function showResult(data) {
      const panel = document.createElement("div");
      panel.className = "panel";

      const head = document.createElement("div");
      head.className = "panel-head";
      const title = document.createElement("span");
      title.className = "panel-title";
      title.textContent = "Résultat de l'analyse";
      if ("prediction" in data) {
        // the audio engine answered: green badge = normal, red badge = abnormal
        const normal = data.prediction === "normal";
        head.append(title, makeBadge(normal ? "Normal" : "Anormal", normal ? "green" : "red"));
      } else {
        head.append(title, makeBadge("Reçu", "blue"));
      }

      const rows = document.createElement("dl");
      for (const key in data) {
        // empty field (for example: no warning) -> no line. The benchmark has its own table (below)
        if (data[key] === null || key === "benchmark") continue;
        const row = document.createElement("div");
        row.className = "row";
        const name = document.createElement("dt");
        name.textContent = LABELS[key] || key;
        const value = document.createElement("dd");
        if (key === "prediction") {
          // the audio engine answers "normal" or "abnormal": green or red badge
          const normal = data[key] === "normal";
          value.append(makeBadge(normal ? "Normal" : "Anormal", normal ? "green" : "red"));
        } else {
          value.textContent = formatValue(key, data[key]);
        }
        row.append(name, value);
        rows.append(row);
      }

      panel.append(head, rows);
      result.append(panel);
      if (data.benchmark) showBenchmark(data.benchmark);
    }

    // ---------- 5. the benchmark: the answer of each model for this wav + its scores in MLflow ----------
    function showBenchmark(answers) {
      const panel = document.createElement("div");
      panel.className = "panel bench-panel";

      const head = document.createElement("div");
      head.className = "panel-head";
      const title = document.createElement("span");
      title.className = "panel-title";
      title.textContent = "Benchmark des modèles";
      head.append(title, makeBadge("Scores MLflow · 3 folds", "blue"));

      const table = document.createElement("table");
      table.className = "bench";
      const header = document.createElement("tr");
      for (const name of ["Modèle", "Ce wav", "Proba.", "Recall", "Précision", "F1", "Accuracy"]) {
        const th = document.createElement("th");
        th.textContent = name;
        header.append(th);
      }
      table.append(header);

      answers.forEach((answer, i) => {
        const line = document.createElement("tr");
        if (i === 0) line.className = "best";    // the first model = the best recall = the official answer
        const normal = answer.prediction === "normal";
        const cells = [
          (MODEL_NAMES[answer.model] || answer.model) + (i === 0 ? " ★" : ""),
          makeBadge(normal ? "Normal" : "Anormal", normal ? "green" : "red"),
          answer.probability_abnormal === null ? "—" : Math.round(answer.probability_abnormal * 100) + " %",
          answer.recall.toFixed(3),
          answer.precision.toFixed(3),
          answer.f1.toFixed(3),
          answer.accuracy.toFixed(3)
        ];
        for (const cell of cells) {
          const td = document.createElement("td");
          td.append(cell);    // a text or a badge
          line.append(td);
        }
        table.append(line);
      });

      const wrap = document.createElement("div");
      wrap.className = "table-wrap";    // on a phone, the table scrolls sideways
      wrap.append(table);

      const note = document.createElement("div");
      note.className = "bench-note";
      note.textContent = "★ = le modèle officiel (le meilleur recall : il rate le moins de cœurs malades). " +
                         "Le SVM donne une classe, pas une probabilité.";

      panel.append(head, wrap, note);
      result.append(panel);
    }

    function showError(title, text) {
      result.innerHTML = "";
      const box = document.createElement("div");
      box.className = "error";
      const strong = document.createElement("strong");
      strong.textContent = title;
      box.append(strong, text);
      result.append(box);
    }

    // ---------- small helpers ----------
    function makeBadge(text, color) {
      const badge = document.createElement("span");
      badge.className = "badge " + color;
      badge.textContent = text;
      return badge;
    }

    function setLoading(loading) {
      button.disabled = loading;
      button.classList.toggle("loading", loading);
      document.getElementById("btn-text").textContent = loading ? "Analyse en cours…" : "Analyser";
    }

    function formatValue(key, value) {
      if (value === null || value === undefined) return "—";
      if (key === "size_bytes") return formatSize(value) + " (" + value.toLocaleString("fr-FR") + " octets)";
      if (key === "duration_s") return value.toFixed(2) + " s";
      if (key === "probability_abnormal") return Math.round(value * 100) + " %";
      if (key === "model_scores") {
        // the scores of the model on the 3 folds (saved in MLflow)
        return "recall " + value.recall.toFixed(3) + " · précision " + value.precision.toFixed(3) +
               " · F1 " + value.f1.toFixed(3) + " · accuracy " + value.accuracy.toFixed(3);
      }
      if (typeof value === "object") return JSON.stringify(value);
      return value;
    }

    function formatSize(bytes) {
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " Ko";
      return (bytes / 1024 / 1024).toFixed(1) + " Mo";
    }
  </script>
</body>
</html>
