<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CardioAgent-Ops</title>
  <!-- the icon of the browser tab: the same heart + pulse as the header (inline SVG, no file) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none'%3E%3Cpath d='M24 41 C11 32 5 25 5 17 C5 11 9.5 7 15 7 C19 7 22 9.5 24 12.5 C26 9.5 29 7 33 7 C38.5 7 43 11 43 17 C43 25 37 32 24 41 Z' stroke='%232563eb' stroke-width='3.5' stroke-linejoin='round'/%3E%3Cpath d='M9 23 H17 L20 17 L24 29 L27 21 L29 23 H39' stroke='%233b82f6' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    /* white theme with a blue that glows a little on the important things only (main buttons, drop zone, official
       result, probability bar, focused input, chips) - plain CSS, no framework */
    :root {
      --bg: #ffffff; --card: #ffffff; --card-2: #f8fafc; --border: #e5e7eb; --border-2: #cbd5e1;
      --text: #111827; --muted: #64748b;
      --blue: #2563eb; --blue-hover: #3b82f6; --blue-text: #1d4ed8; --blue-tint: rgba(37, 99, 235, 0.08);
      --glow: 0 0 16px rgba(37, 99, 235, 0.35);
      --teal: #0f766e; --teal-tint: rgba(13, 148, 136, 0.10);
      --red: #dc2626; --red-text: #b91c1c; --red-tint: rgba(220, 38, 38, 0.08);
      --amber: #92400e; --amber-tint: #fffbeb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 15px; line-height: 1.5; }
    header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--border);
             background: #ffffff; }
    header svg { width: 34px; height: 34px; flex: none; filter: drop-shadow(0 0 6px rgba(37, 99, 235, 0.40)); }
    header h1 { font-size: 20px; margin: 0; letter-spacing: 0.2px; }
    /* the status on the right: never cut ("● Mode en ligne") */
    .status { margin-left: auto; flex: none; white-space: nowrap; font-size: 13px; color: var(--text); display: flex;
              align-items: center; gap: 7px; padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px;
              background: #ffffff; }
    .status .dot { width: 9px; height: 9px; border-radius: 50%; background: #94a3b8; }
    .status.online .dot { background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.6); }
    .status.offline .dot { background: var(--red); }

    main { max-width: 1840px; margin: 0 auto; padding: 20px 24px; }
    /* 3 columns side by side: the analysis | the report of the agents | the chat */
    .layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 0.95fr);
              grid-template-areas: "analysis report chat"; gap: 20px; align-items: start; }
    .col-analysis { grid-area: analysis; }
    .col-report { grid-area: report; }
    .chat { grid-area: chat; }
    /* a smaller screen: the report goes under the analysis; a phone: 1 column */
    @media (max-width: 1300px) { .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                                           grid-template-areas: "analysis chat" "report chat"; } }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; grid-template-areas: "analysis" "report" "chat"; } }
    .placeholder { color: var(--muted); font-size: 14px; }

    .card { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 16px 18px; margin-bottom: 16px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06); }
    .card h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card h2 .right { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

    /* the wav */
    .drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center;
            border: 2px dashed var(--border-2); border-radius: 12px; background: var(--card-2); padding: 26px 16px;
            cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s; }
    .drop.over, .drop:hover { border-color: var(--blue); box-shadow: var(--glow); }
    .drop.has-file { border-style: solid; border-color: var(--blue); }
    .drop.bad-file { border-color: var(--red); background: var(--red-tint); }
    .drop svg { width: 34px; height: 34px; }
    .drop-title { font-weight: 600; }
    .drop-hint { color: var(--muted); font-size: 13px; }
    .drop input { display: none; }
    .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .btn { border: 1px solid var(--blue); background: var(--blue); color: #fff; border-radius: 8px; padding: 9px 18px;
           font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: var(--glow); transition: background 0.2s; }
    .btn:hover { background: var(--blue-hover); border-color: var(--blue-hover); }
    .btn.secondary { background: #ffffff; color: var(--blue-text); border-color: var(--border-2); box-shadow: none; }
    .btn.secondary:hover { background: var(--blue-tint); border-color: var(--blue); }
    .btn:disabled { opacity: 0.55; cursor: wait; }

    /* the results */
    .official { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .big-badge { font-size: 22px; font-weight: 700; padding: 8px 18px; border-radius: 10px; }
    .big-badge.normal { background: var(--teal-tint); color: var(--teal); border: 1px solid rgba(13, 148, 136, 0.45);
                        box-shadow: 0 0 16px rgba(13, 148, 136, 0.25); }
    .big-badge.abnormal { background: var(--red-tint); color: var(--red-text); border: 1px solid rgba(220, 38, 38, 0.45);
                          box-shadow: 0 0 16px rgba(220, 38, 38, 0.25); }
    .proba { flex: 1; min-width: 200px; }
    .proba-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
    .proba-label strong { color: var(--text); }
    .bar { position: relative; height: 12px; border-radius: 6px; background: #f1f5f9; border: 1px solid var(--border); overflow: hidden; }
    .bar .fill { height: 100%; background: var(--blue); box-shadow: var(--glow); }
    .bar .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #94a3b8; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 10px; }
    .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid; }
    .badge.green { color: var(--teal); background: var(--teal-tint); border-color: rgba(13, 148, 136, 0.35); }
    .badge.red { color: var(--red-text); background: var(--red-tint); border-color: rgba(220, 38, 38, 0.35); }
    .badge.blue { color: var(--blue-text); background: var(--blue-tint); border-color: rgba(37, 99, 235, 0.35); }
    .badge.grey { color: var(--muted); background: var(--card-2); border-color: var(--border); }
    .warning { background: var(--amber-tint); color: var(--amber); border: 1px solid #fde68a; border-radius: 8px; padding: 8px 12px; margin-top: 10px; font-size: 14px; }
    .error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; }
    .error strong { display: block; color: #b91c1c; }

    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { padding: 6px 6px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; background: var(--card-2); }
    tr.best td { background: var(--blue-tint); font-weight: 600; }
    .note { color: var(--muted); font-size: 12px; margin-top: 8px; }

    dl { margin: 0; }
    .row { display: grid; grid-template-columns: 140px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
    .row:last-child { border-bottom: none; }
    dt { color: var(--muted); font-size: 13px; }
    dd { margin: 0; }
    dd ul { margin: 0; padding-left: 18px; }
    @media (max-width: 600px) { .row { grid-template-columns: 1fr; gap: 2px; } }
    .waiting { display: flex; align-items: center; gap: 10px; color: var(--muted); }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(37, 99, 235, 0.25); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.9s linear infinite; flex: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* the chat */
    .chat { position: sticky; top: 16px; display: flex; flex-direction: column; height: calc(100vh - 110px); min-height: 480px; padding: 0; }
    .chat-head { padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .chat-head h2 { margin: 0; }
    .chat-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .messages { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--blue); color: #fff; border-bottom-right-radius: 4px;
                box-shadow: 0 0 12px rgba(37, 99, 235, 0.25); }
    .msg.assistant { align-self: flex-start; background: #f1f5f9; color: var(--text); border-bottom-left-radius: 4px; }
    .msg.assistant.refused { background: var(--card-2); border: 1px solid var(--border); }
    .msg.assistant.failed { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .typing { align-self: flex-start; display: flex; align-items: center; gap: 8px; color: var(--blue-text); font-size: 13px; }
    .dots { display: flex; gap: 4px; background: #f1f5f9; padding: 10px 12px; border-radius: 12px; }
    .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); animation: blink 1.2s infinite; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 18px 0; border-top: 1px solid var(--border); }
    .chip { border: 1px solid rgba(37, 99, 235, 0.30); background: var(--blue-tint); color: var(--blue-text); border-radius: 999px;
            padding: 4px 11px; font-size: 13px; cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s; }
    .chip:hover { border-color: var(--blue); box-shadow: var(--glow); }
    .chat-input { display: flex; gap: 8px; padding: 10px 18px 14px; }
    .chat-input input { flex: 1; border: 1px solid var(--border-2); border-radius: 8px; padding: 9px 12px; font-size: 15px;
                        color: var(--text); background: #ffffff; }
    .chat-input input::placeholder { color: var(--muted); }
    .chat-input input:focus { outline: none; border-color: var(--blue); box-shadow: var(--glow); }
    @media (max-width: 900px) { .chat { position: static; height: 560px; } }

    footer { max-width: 1840px; margin: 0 auto; padding: 0 24px 20px; font-size: 13px; display: flex; gap: 16px; justify-content: flex-end; }
    footer a { color: var(--blue-text); text-decoration: none; }
    footer .mode-note { margin-right: auto; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <!-- an original icon: a heart outline with a pulse line inside (inline SVG) -->
    <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <path d="M24 41 C11 32 5 25 5 17 C5 11 9.5 7 15 7 C19 7 22 9.5 24 12.5 C26 9.5 29 7 33 7 C38.5 7 43 11 43 17 C43 25 37 32 24 41 Z"
            stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
      <path d="M9 23 H17 L20 17 L24 29 L27 21 L29 23 H39" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>CardioAgent-Ops</h1>
    <span id="status" class="status"><span class="dot"></span><span id="status-text">Connexion…</span></span>
  </header>

  <main>
    <div class="layout">
      <!-- column 1: the wav and its analysis -->
      <section class="col-analysis">
        <div class="card">
          <h2>1. Votre enregistrement</h2>
          <label id="drop" class="drop" for="file">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M2 12h3l2-5 3 10 3-8 2 3h7"/>
            </svg>
            <span id="drop-title" class="drop-title">Glissez votre fichier .wav ici</span>
            <span id="drop-hint" class="drop-hint">ou cliquez pour le choisir</span>
            <input type="file" id="file" accept=".wav,audio/wav">
          </label>
          <div class="actions">
            <button class="btn secondary" onclick="document.getElementById('file').click()">Choisir un .wav</button>
            <button id="analyze-btn" class="btn" onclick="analyze()">Analyser</button>
          </div>
        </div>
        <div id="result"></div>
      </section>

      <!-- column 2: the report of the 3 agents -->
      <section class="col-report" id="report-col"></section>

      <!-- column 3: the chat with the assistant -->
      <section class="card chat">
        <div class="chat-head">
          <h2>2. Posez une question sur votre résultat</h2>
          <p>L'assistant répond à partir de votre analyse et de documents de cardiologie. Il ne pose pas de diagnostic.</p>
        </div>
        <div id="messages" class="messages"></div>
        <div class="chips" id="chips"></div>
        <div class="chat-input">
          <input id="question" type="text" maxlength="1000" placeholder="Votre question… (Entrée pour envoyer)">
          <button id="send-btn" class="btn" onclick="sendQuestion()">Envoyer</button>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <span id="mode-note" class="mode-note"></span>
    <a href="/docs">Documentation API</a>
    <a href="/health">État du service</a>
  </footer>

  <script>
    const MODEL_NAMES = {
      DecisionTree: "Arbre de décision", SVM: "SVM", CNN: "CNN", ResNet50: "ResNet50 (transfer learning)",
      TransformerCNN: "Transformer-CNN", Ensemble: "Ensemble (vote de 4 modèles)"
    };
    const RISK_COLORS = { "faible": "green", "modéré": "blue", "élevé": "red" };
    const SUGGESTIONS = ["Dois-je consulter un médecin ?", "Ce son est-il normal ?", "Que signifie la probabilité ?",
                         "C'est quoi un souffle cardiaque ?"];

    const fileInput = document.getElementById("file");
    const drop = document.getElementById("drop");
    const result = document.getElementById("result");
    const reportCol = document.getElementById("report-col");
    const analyzeButton = document.getElementById("analyze-btn");
    const messages = document.getElementById("messages");
    const questionInput = document.getElementById("question");
    const sendButton = document.getElementById("send-btn");

    let lastAnalysis = null;   // the last analysis {audio, report}: sent with each question (no database)
    let history = [];          // the conversation: [{role, content}], the last 6 are sent
    let analysisNumber = 0;    // to ignore a late report of an older wav

    // ---------- is the API running? ----------
    fetch("/health")
      .then(r => r.json().then(data => { setStatus(r.ok, data.llm_provider); showMode(data.llm_provider); }))
      .catch(() => setStatus(false));
    function setStatus(online, provider) {
      // the badge at the top right: "Mode en ligne" (Groq / xAI), "Mode local" (Ollama) or "API hors ligne"
      document.getElementById("status").className = "status " + (online ? "online" : "offline");
      let text = "API hors ligne";
      if (online && (provider === "groq" || provider === "xai")) text = "Mode en ligne";
      else if (online && provider === "ollama") text = "Mode local";
      else if (online) text = "API en ligne";
      document.getElementById("status-text").textContent = text;
    }
    function showMode(provider) {
      // the privacy note of the footer: what leaves the computer in each mode of the LLM
      const note = document.getElementById("mode-note");
      if (provider === "groq" || provider === "xai") {
        note.textContent = "Mode en ligne : votre question et les chiffres de l'analyse sont envoyés au service d'IA (" +
                           (provider === "groq" ? "Groq" : "xAI") + "). L'audio et le nom du fichier ne sont jamais envoyés.";
      } else if (provider === "ollama") {
        note.textContent = "Mode local : rien ne quitte votre ordinateur.";
      }
    }

    // ---------- choose the wav: click or drag & drop ----------
    fileInput.addEventListener("change", showChosenFile);
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => {
      e.preventDefault();
      drop.classList.remove("over");
      fileInput.files = e.dataTransfer.files;
      showChosenFile();
    });
    function showChosenFile() {
      const file = fileInput.files[0];
      if (!file) return;
      const isWav = file.name.toLowerCase().endsWith(".wav");
      drop.classList.toggle("has-file", isWav);
      drop.classList.toggle("bad-file", !isWav);
      document.getElementById("drop-title").textContent = file.name;
      document.getElementById("drop-hint").textContent = (isWav ? formatSize(file.size) : "Ce n'est pas un .wav") + " · cliquez pour changer";
    }

    // ---------- analyse: 1. the audio result (1 s), 2. the report of the agents (minutes on a CPU) ----------
    async function analyze() {
      const file = fileInput.files[0];
      if (!file) { result.innerHTML = ""; showError("Aucun fichier", "Choisissez d'abord un fichier .wav."); return; }
      const number = ++analysisNumber;
      analyzeButton.disabled = true;
      analyzeButton.textContent = "Analyse…";
      result.innerHTML = "";
      reportCol.innerHTML = "";
      const form = new FormData();
      form.append("file", file);
      let audio = null;
      try {
        const response = await fetch("/analyze_pcg?agents=false", { method: "POST", body: form });
        const data = await response.json();
        if (!response.ok) {
          showError(response.status === 503 ? "Service en démarrage" : "Erreur " + response.status,
                    typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail));
        } else if (!("prediction" in data)) {
          showError("Moteur audio non connecté", data.message || JSON.stringify(data));
        } else {
          audio = data;
        }
      } catch (error) {
        showError("Le serveur ne répond pas", String(error));
      }
      analyzeButton.disabled = false;
      analyzeButton.textContent = "Analyser";
      if (!audio) { showReportPlaceholder(); return; }

      lastAnalysis = { audio: audio, report: null };
      showAudio(audio);
      addMessage("assistant", "Analyse prête : son « " + (audio.prediction === "normal" ? "normal" : "anormal") + " ». Je vous écoute !");

      // step 2: the report of the 3 agents
      const waiting = card("Rapport des agents IA");
      const line = document.createElement("div");
      line.className = "waiting";
      const spin = document.createElement("span");
      spin.className = "spinner";
      line.append(spin, "Les agents (Analyste → Cardiologue → Auditeur) rédigent le rapport…");
      waiting.append(line);
      reportCol.append(waiting);
      try {
        const response = await fetch("/report", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(audio) });
        const data = await response.json();
        if (number !== analysisNumber) return;             // a newer wav was analysed meanwhile
        waiting.remove();
        if (response.ok && data.report) {
          lastAnalysis.report = data.report;
          showReport(data.report);
        } else {
          showError("Rapport des agents indisponible", typeof data.detail === "string" ? data.detail : "Réessayez plus tard.", reportCol);
        }
      } catch (error) {
        if (number !== analysisNumber) return;
        waiting.remove();
        showError("Rapport des agents indisponible", String(error), reportCol);
      }
    }

    function showAudio(audio) {
      // the official answer: big badge + probability bar
      const panel = card("Résultat de l'analyse");
      const official = document.createElement("div");
      official.className = "official";
      const normal = audio.prediction === "normal";
      const big = document.createElement("span");
      big.className = "big-badge " + (normal ? "normal" : "abnormal");
      big.textContent = normal ? "Normal" : "Anormal";
      official.append(big);
      if (audio.probability_abnormal !== null && audio.probability_abnormal !== undefined) {
        const p = audio.probability_abnormal;
        const proba = document.createElement("div");
        proba.className = "proba";
        const label = document.createElement("div");
        label.className = "proba-label";
        const left = document.createElement("span");
        left.textContent = "Probabilité « anormal »";
        const right = document.createElement("strong");
        right.textContent = Math.round(p * 100) + " %";
        label.append(left, right);
        const bar = document.createElement("div");
        bar.className = "bar";
        const fill = document.createElement("div");
        fill.className = "fill";
        fill.style.width = Math.round(p * 100) + "%";
        const mid = document.createElement("div");
        mid.className = "mid";
        bar.append(fill, mid);
        proba.append(label, bar);
        official.append(proba);
      }
      panel.append(official);
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = "Modèle officiel : " + (MODEL_NAMES[audio.model] || audio.model) + " (meilleur recall de validation) · " +
                         "fichier : " + audio.filename + " · durée : " + Number(audio.duration_s).toFixed(1) + " s";
      panel.append(meta);
      if (audio.warning) {
        const warning = document.createElement("div");
        warning.className = "warning";
        warning.textContent = "Attention : " + audio.warning;
        panel.append(warning);
      }
      result.append(panel);
      showBenchmark(audio.benchmark);
    }

    function showBenchmark(answers) {
      const panel = card("Les modèles pour ce son", [makeBadge("Scores MLflow · validation + test", "blue")]);
      const table = document.createElement("table");
      const header = document.createElement("tr");
      for (const name of ["Modèle", "Ce son", "Proba.", "Recall val.", "Préc. val.", "F1 val.", "Recall test", "F1 test"]) {
        const th = document.createElement("th");
        th.textContent = name;
        header.append(th);
      }
      table.append(header);
      answers.forEach((answer, i) => {
        const line = document.createElement("tr");
        if (i === 0) line.className = "best";
        const normal = answer.prediction === "normal";
        const cells = [
          (MODEL_NAMES[answer.model] || answer.model) + (i === 0 ? " ★" : ""),
          makeBadge(normal ? "Normal" : "Anormal", normal ? "green" : "red"),
          answer.probability_abnormal === null ? "—" : Math.round(answer.probability_abnormal * 100) + " %",
          formatScore(answer.recall), formatScore(answer.precision), formatScore(answer.f1),
          formatScore(answer.test_recall), formatScore(answer.test_f1)
        ];
        for (const cell of cells) {
          const td = document.createElement("td");
          td.append(cell);
          line.append(td);
        }
        table.append(line);
      });
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      wrap.append(table);
      const note = document.createElement("div");
      note.className = "note";
      note.textContent = "★ = le modèle officiel (le meilleur recall de validation : il rate le moins de cœurs malades). " +
                         "Validation = moyenne des 3 folds, test = 20 % des wavs jamais vus. Le SVM donne une classe, pas une probabilité.";
      panel.append(wrap, note);
      result.append(panel);
    }

    function showReport(report) {
      const badges = [makeBadge("Risque " + report.risk_level, RISK_COLORS[report.risk_level] || "blue")];
      badges.push(report.audit.approved ? makeBadge("Validé par l'Auditeur", "green") : makeBadge("Rapport de secours", "grey"));
      const panel = card("Rapport des agents IA", badges);
      const rows = document.createElement("dl");
      rows.append(makeRow("Résumé", report.summary));
      rows.append(makeRow("Explication", report.clinical_explanation));
      rows.append(makeRow("Recommandations", makeList(report.recommendations)));
      const sources = report.sources.map(s => s.title + " (p. " + s.page + ")");
      rows.append(makeRow("Sources (RAG)", sources.length ? makeList(sources) : "—"));
      if (report.audit.issues.length) rows.append(makeRow("Audit", makeList(report.audit.issues)));
      panel.append(rows);
      reportCol.append(panel);
    }

    function showReportPlaceholder() {
      // before any analysis: the middle column says what will appear there
      const panel = card("Rapport des agents IA");
      const text = document.createElement("div");
      text.className = "placeholder";
      text.textContent = "Le rapport des 3 agents (Analyste → Cardiologue → Auditeur) apparaîtra ici après l'analyse.";
      panel.append(text);
      reportCol.append(panel);
    }
    showReportPlaceholder();

    // ---------- the chat ----------
    addMessage("assistant", "Bonjour ! Une question sur votre résultat ou sur le cœur ?");
    const chips = document.getElementById("chips");
    for (const text of SUGGESTIONS) {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = text;
      chip.onclick = () => { questionInput.value = text; sendQuestion(); };
      chips.append(chip);
    }
    questionInput.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); sendQuestion(); } });

    async function sendQuestion() {
      const question = questionInput.value.trim();
      if (!question || sendButton.disabled) return;
      questionInput.value = "";
      addMessage("user", question);
      sendButton.disabled = true;
      const typing = document.createElement("div");
      typing.className = "typing";
      const dots = document.createElement("div");
      dots.className = "dots";
      dots.append(document.createElement("span"), document.createElement("span"), document.createElement("span"));
      typing.append(dots, "L'assistant écrit…");
      messages.append(typing);
      messages.scrollTop = messages.scrollHeight;
      try {
        const response = await fetch("/chat", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: question, analysis: lastAnalysis, history: history.slice(-6) })
        });
        const data = await response.json();
        typing.remove();
        if (response.ok) {
          addMessage("assistant", data.answer, data.sources, data.on_topic ? "" : "refused");
          history.push({ role: "user", content: question }, { role: "assistant", content: data.answer });
        } else {
          const detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
          addMessage("assistant", response.status === 503 ? detail : "Erreur " + response.status + " : " + detail, [], "failed");
        }
      } catch (error) {
        typing.remove();
        addMessage("assistant", "L'assistant ne répond pas : " + String(error), [], "failed");
      }
      sendButton.disabled = false;
      questionInput.focus();
    }

    function addMessage(role, text, sources = [], extra = "") {
      // the sources are not shown in the chat (only in the report): the citation numbers [1], [2]... are removed too
      const bubble = document.createElement("div");
      bubble.className = "msg " + role + (extra ? " " + extra : "");
      bubble.append(text.replace(/\s*\[\d+(,\s*\d+)*\]/g, ""));
      messages.append(bubble);
      messages.scrollTop = messages.scrollHeight;
    }

    // ---------- small helpers ----------
    function card(title, badges = []) {
      const panel = document.createElement("div");
      panel.className = "card";
      const h2 = document.createElement("h2");
      h2.append(title);
      if (badges.length) {
        const right = document.createElement("span");
        right.className = "right";
        right.append(...badges);
        h2.append(right);
      }
      panel.append(h2);
      return panel;
    }
    function showError(title, text, where = result) {
      const box = document.createElement("div");
      box.className = "error";
      const strong = document.createElement("strong");
      strong.textContent = title;
      box.append(strong, text);
      where.append(box);
    }
    function makeBadge(text, color) {
      const badge = document.createElement("span");
      badge.className = "badge " + color;
      badge.textContent = text;
      return badge;
    }
    function makeRow(label, content) {
      const row = document.createElement("div");
      row.className = "row";
      const name = document.createElement("dt");
      name.textContent = label;
      const value = document.createElement("dd");
      value.append(content);
      row.append(name, value);
      return row;
    }
    function makeList(items) {
      const list = document.createElement("ul");
      for (const item of items) {
        const li = document.createElement("li");
        li.textContent = item;
        list.append(li);
      }
      return list;
    }
    function formatScore(value) { return (value === null || value === undefined) ? "—" : Number(value).toFixed(3); }
    function formatSize(bytes) { return bytes < 1024 * 1024 ? (bytes / 1024).toFixed(1) + " Ko" : (bytes / 1024 / 1024).toFixed(1) + " Mo"; }
  </script>
</body>
</html>
